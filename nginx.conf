server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Basic SPA fallback (safe even if you only use /)
  location / {
    try_files $uri /index.html;
  }

  # Cache static assets aggressively; bust via hashed filenames
  location ~* \.(?:js|css|ico|png|jpg|jpeg|svg|webp)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri /index.html;
  }
}
